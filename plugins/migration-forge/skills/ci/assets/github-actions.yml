# Generated by /migration-forge:ci. Runs the same deterministic gate as the local session.
# Placeholders {{...}} are filled by the ci skill with versions verified at generation time.
name: forge-gates

on:
  pull_request:
  push:
    branches: [ {{DEFAULT_BRANCH}} ]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORGE_GATES_OVERRIDE: .forge-ci/gates.ci.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # diff-cover and review need history back to state.base_ref

      # Legacy source is gitignored in the workspace; check it out read-only for the side-by-side env.
      - uses: actions/checkout@v4
        with:
          repository: {{LEGACY_REPOSITORY}}     # owner/name of the legacy repo
          ref: {{LEGACY_REF}}                   # frozen commit the migration started from
          path: legacy/{{NAME}}
          token: ${{ secrets.LEGACY_REPO_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "{{PYTHON_VERSION}}"

{{RUNTIME_SETUP}}

      - name: Install gate tools (pinned)
        run: |
          python -m pip install "semgrep=={{SEMGREP_VERSION}}" "diff-cover=={{DIFF_COVER_VERSION}}" {{PIP_AUDIT}}
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v{{GITLEAKS_VERSION}}/gitleaks_{{GITLEAKS_VERSION}}_linux_x64.tar.gz" | sudo tar xz -C /usr/local/bin gitleaks
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v{{TRIVY_VERSION}}/trivy_{{TRIVY_VERSION}}_Linux-64bit.tar.gz" | sudo tar xz -C /usr/local/bin trivy
          gitleaks version && trivy --version && semgrep --version

      - name: Install dependencies of the modernized code
        working-directory: {{MODERNIZED_ROOT}}
        run: |
{{INSTALL_COMMANDS}}

      - name: Start legacy + modernized side by side
        run: python .forge-ci/scripts/env.py up

      - name: Behavioral evals
        run: python .forge-ci/scripts/evals_run.py

      - name: Gate
        run: python .forge-ci/scripts/run_gates.py

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-gates
          path: |
            forge/gates/latest.json
            forge/gates/iteration-*/
            forge/evals/results.json

      - name: Stop env
        if: always()
        run: python .forge-ci/scripts/env.py down

